version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    container_name: kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    networks:
      - ecommerce-network

  event-generator:
    build: .
    container_name: event-generator
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
    networks:
      - ecommerce-network
    command: python /app/scripts/generate_events.py

volumes:
  esdata:

networks:
  ecommerce-network:
    driver: bridge